name: "Build"
on:
  push:
    branches: [ master ]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test
      - name: Check tests/ generated code is up to date
        run: |
          make test-gen
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of date; run 'make test-gen' and commit the result."
            git status --porcelain
            git diff
            exit 1
          fi
